<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <title>Entrar — Meu Financeiro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="brand" style="margin-bottom:18px">
        <span class="brand-mark">R$</span> Meu Financeiro
      </div>

      <!-- Login -->
      <div id="panel-login">
        <h1>Bem-vindo de volta</h1>
        <p class="sub">Entre para acompanhar suas finanças.</p>
        <form id="form-login">
          <label class="field">E-mail
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="field">Senha
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <p class="error-msg" id="login-error"></p>
          <button class="btn" type="submit">Entrar</button>
        </form>
        <p class="auth-switch">Ainda não tem conta? <a id="show-register">Criar conta</a></p>
      </div>

      <!-- Registro -->
      <div id="panel-register" hidden>
        <h1>Criar sua conta</h1>
        <p class="sub">Grátis. Seus dados ficam só com você.</p>
        <form id="form-register">
          <label class="field">Nome
            <input type="text" name="name" required autocomplete="name" maxlength="60">
          </label>
          <label class="field">E-mail
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="field">Senha (mínimo 8 caracteres)
            <input type="password" name="password" required minlength="8" autocomplete="new-password">
          </label>
          <p class="error-msg" id="register-error"></p>
          <button class="btn" type="submit">Criar conta</button>
        </form>
        <p class="auth-switch">Já tem conta? <a id="show-login">Entrar</a></p>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);

    $('#show-register').onclick = () => { $('#panel-login').hidden = true; $('#panel-register').hidden = false; };
    $('#show-login').onclick = () => { $('#panel-register').hidden = true; $('#panel-login').hidden = false; };

    async function submit(path, form, errorEl) {
      errorEl.textContent = '';
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.ok) { location.href = '/'; return; }
      const body = await res.json().catch(() => ({}));
      errorEl.textContent = body.error || 'Algo deu errado. Tente novamente.';
    }

    $('#form-login').addEventListener('submit', (e) => {
      e.preventDefault();
      submit('/api/login', e.target, $('#login-error'));
    });
    $('#form-register').addEventListener('submit', (e) => {
      e.preventDefault();
      submit('/api/register', e.target, $('#register-error'));
    });
  </script>
</body>
</html>
